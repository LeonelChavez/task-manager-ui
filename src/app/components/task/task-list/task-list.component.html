<div class="container mt-3">
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Description</th>
        <th>Completed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody *ngFor="let task of tasks">
      <tr>
        <td>{{ task.id }}</td>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td> <input type="checkbox" [checked]="task.completed" disabled> </td>
        <td>
          <button class="btn btn-sm btn-info" routerLink="/task/{{task.id}}/edit">Update</button>
          <button class="btn btn-sm btn-danger" (click)="deleteTask(task.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="mt-3">
    <a routerLink="/task/new" class="btn btn-success">Add task</a>
  </div>
</div>
