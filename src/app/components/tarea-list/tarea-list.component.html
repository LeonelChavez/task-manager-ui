<div class="container mt-3">
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Títle</th>
        <th>Description</th>
        <th>Completed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody *ngFor="let tarea of tareas">
      <tr>
        <td>{{ tarea.id }}</td>
        <td>{{ tarea.title }}</td>
        <td>{{ tarea.description }}</td>
        <td> <input type="checkbox" [checked]="tarea.completed" disabled> </td>
        <td>
          <button class="btn btn-sm btn-info" routerLink="/tareas/{{tarea.id}}/edit">Actualizar</button>
          <button class="btn btn-sm btn-danger" (click)="eliminarTarea(tarea.id)">eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="mt-3">
    <a routerLink="/tareas/new" class="btn btn-success">Agregar tarea</a>
  </div>
</div>
